<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ส้มตำข้ามภพ</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1a10;--cream:#fff6e5;--gold:#ffcf5a;--red:#e2402b;--green:#3f9a4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#140b1e;color:var(--ink);font-family:Sarabun,sans-serif}
body{display:flex;justify-content:center}
button{font-family:Mitr,sans-serif;cursor:pointer;border:0}
#game{position:relative;width:100%;max-width:1000px;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}

#hud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:8px 14px;background:#1d0f2b;color:#ffe9c4;font-family:Mitr;font-size:15px;z-index:6;border-bottom:2px solid #3a2050}
#hud .grp{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
#hud b{color:var(--gold);font-weight:500}
#hud .logo{font-weight:600;color:#ff9a6a;font-size:17px}

#stage{position:relative;height:320px;flex:none;overflow:hidden;
 background:linear-gradient(#21123d 0%,#4a2463 30%,#a3475a 58%,#ee9256 80%,#f7c27a 100%)}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.7;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.15}}
.moon{position:absolute;border-radius:50%}
#moon1{width:58px;height:58px;left:46%;top:44px;background:radial-gradient(circle at 35% 35%,#fffbe8,#ffe7a8 55%,#e9b866);box-shadow:0 0 40px #ffe7a8aa}
#moon2{width:24px;height:24px;left:54%;top:96px;background:radial-gradient(circle at 35% 35%,#e9f4ff,#9fc4ff 60%,#5f84d6);box-shadow:0 0 24px #9fc4ffaa}
.lantern{position:absolute;bottom:-40px;width:18px;height:24px;border-radius:6px 6px 9px 9px;background:radial-gradient(circle at 50% 40%,#fff2b0,#ffb547 50%,#d9542a);box-shadow:0 0 16px 4px #ffb54788;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0)}50%{transform:translateY(-190px) translateX(14px)}to{transform:translateY(-380px) translateX(-6px);opacity:0}}
#skyline{position:absolute;left:0;right:0;bottom:0;height:90px;background:
 radial-gradient(ellipse 60px 40px at 8% 100%,#3a1f3e 98%,transparent),
 radial-gradient(ellipse 90px 55px at 30% 100%,#40223f 98%,transparent),
 radial-gradient(ellipse 70px 46px at 62% 100%,#3a1f3e 98%,transparent),
 radial-gradient(ellipse 110px 60px at 88% 100%,#40223f 98%,transparent);opacity:.75}
#awning{position:absolute;top:0;left:0;right:0;height:26px;z-index:3;background:repeating-linear-gradient(90deg,#d63a2a 0 44px,#fff1d6 44px 88px);box-shadow:0 4px 10px #0006}
#awning:after{content:"";position:absolute;left:0;right:0;top:26px;height:14px;background:radial-gradient(circle at 22px 0,#d63a2a 21px,transparent 22px) 0 0/88px 14px repeat-x,radial-gradient(circle at 22px 0,#fff1d6 21px,transparent 22px) 44px 0/88px 14px repeat-x}

.slot{position:absolute;top:0;bottom:0;width:50%;z-index:2;cursor:pointer}
#s0{left:0}#s1{left:50%}
.slot .tag{position:absolute;left:10px;top:44px;z-index:4;font-family:Mitr;font-size:12px;color:#fff;background:#0006;padding:1px 8px;border-radius:10px}
.slot.sel .tag{background:var(--gold);color:#4a2a10}
.spot{position:absolute;left:4%;bottom:-24px;width:190px;height:60px;border-radius:50%;background:radial-gradient(ellipse,#ffe08a99,transparent 70%);opacity:0;transition:opacity .3s}
.slot.sel .spot{opacity:1}
.cust{position:absolute;left:4%;bottom:-4px;width:180px;height:225px;transition:transform .6s ease-in}
.cust svg{width:100%;height:100%;overflow:visible;animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scaleY(.985) translateY(1px)}}
#s0 .cust.out{transform:translateX(-140%)}
#s1 .cust.out{transform:translateX(320%)}
#s0 .cust.enter{animation:enterL .65s cubic-bezier(.2,.9,.3,1.1)}
#s1 .cust.enter{animation:enterR .65s cubic-bezier(.2,.9,.3,1.1)}
@keyframes enterL{from{transform:translateX(-140%)}to{transform:none}}
@keyframes enterR{from{transform:translateX(320%)}to{transform:none}}
.cust.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px) rotate(-1deg)}40%,80%{transform:translateX(7px) rotate(1deg)}}
.cust.float{animation:floaty 1s ease-in-out}
@keyframes floaty{50%{transform:translateY(-20px)}}
.cust.stink svg{filter:drop-shadow(0 0 10px #7ddf55) hue-rotate(25deg) saturate(.85)}
.cust.gold svg{filter:drop-shadow(0 0 22px #ffd84a) brightness(1.08)}
.head{transform-origin:100px 110px}
.head.sour{animation:sour .55s ease-in-out 2}
@keyframes sour{0%,100%{transform:none}30%{transform:scale(1.14,.8)}65%{transform:scale(.9,1.12)}}
.pbar{position:absolute;left:4%;width:180px;bottom:8px;height:9px;border-radius:6px;background:#0007;z-index:4;overflow:hidden;display:none}
.pbar i{display:block;height:100%;width:100%;background:#5fd068;border-radius:6px;transition:width .1s linear,background .3s}

.bubble{position:absolute;left:calc(4% + 172px);right:10px;top:62px;z-index:4;background:#fff;border-radius:16px;padding:10px 14px;font-size:16px;font-weight:600;line-height:1.42;box-shadow:0 8px 24px #0005;opacity:0;transform:scale(.85);transform-origin:0 80%;transition:.2s;pointer-events:none}
.bubble.show{opacity:1;transform:none}
.bubble:before{content:"";position:absolute;left:-12px;top:34px;border:10px solid transparent;border-right:14px solid #fff;border-left:0}
.bubble .who{display:block;font-family:Mitr;font-weight:500;font-size:12px;color:#a0522d;margin-bottom:2px}
.bubble.angry{background:#ffe1dc;animation:shake .35s}
.bubble.angry:before{border-right-color:#ffe1dc}
.rvpop{position:absolute;left:calc(4% + 150px);right:10px;top:58px;z-index:6;background:var(--cream);border-radius:14px;padding:9px 12px;box-shadow:0 10px 26px #000a;font-size:14px;pointer-events:none}
.rvpop .st{font-size:20px;color:#d8cbb4;letter-spacing:1px}.rvpop .st b{color:#ffb400;font-weight:400}
.rvpop .mn{float:right;font-family:Mitr;font-size:17px}
.rvpop .mn.pos{color:#2c8a3f}.rvpop .mn.neg{color:#c0392b}
.rvpop .tx{font-weight:600;line-height:1.35;margin-top:2px}
.rvpop small{color:#8a6a4a}

#fx{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:visible}
.flame{position:absolute;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#fffbd0 0%,#ffd23f 30%,#ff7a00 55%,rgba(220,40,0,.8) 68%,rgba(200,30,0,0) 74%);mix-blend-mode:screen;filter:blur(.6px)}
.drop{position:absolute;width:8px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 40% 35%,#fff,#7cc8ff 50%,#3d8fd6)}
.spark{position:absolute;font-size:20px;color:#ffe680;text-shadow:0 0 8px #fff}
.wisp{position:absolute;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle,#b6f58c 0%,#6fcf4a 45%,rgba(90,180,60,0) 70%);filter:blur(3px)}
.poptext{position:absolute;font-family:Mitr;font-weight:600;font-size:22px;white-space:nowrap;text-shadow:0 3px 0 #0008,0 0 14px #0006}
.ghost{position:absolute;width:52px;height:62px}

#counter{flex:1;position:relative;display:grid;grid-template-columns:280px 1fr;grid-template-areas:"mortar tickets" "mortar tray";gap:12px 16px;padding:16px 16px 20px;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 2px,transparent 2px 11px),linear-gradient(#8a5530,#5d3418);
 border-top:12px solid #b0733f;box-shadow:inset 0 10px 18px #0005}
#leftcol{grid-area:mortar;display:flex;flex-direction:column;align-items:center;gap:8px}
#tickets{grid-area:tickets;display:grid;grid-template-columns:1fr 1fr;gap:12px}
#tray{grid-area:tray;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px;align-content:start}

#mortarWrap{position:relative;width:260px;height:214px;cursor:pointer;touch-action:manipulation}
#mortarWrap svg.m{position:absolute;left:10px;top:12px;width:240px;height:200px}
#contents{position:absolute;left:0;top:0;width:260px;height:214px;pointer-events:none}
#contents .it{position:absolute;width:38px;height:38px;transition:transform .12s,opacity .12s}
#contents .it svg{width:100%;height:100%}
#pestle{position:absolute;width:44px;height:170px;left:120px;top:-86px;transform:rotate(10deg);transform-origin:50% 90%;pointer-events:none;z-index:3;filter:drop-shadow(4px 6px 4px #0006)}
#tapHint{position:absolute;left:4px;top:-2px;text-align:left;width:110px;line-height:1.3;font-family:Mitr;font-size:13px;color:#ffe9c4;opacity:.75;pointer-events:none;z-index:5}
#mashBox{width:250px}
#mashBar{position:relative;height:16px;border-radius:8px;background:linear-gradient(90deg,#6b4a2a,#a07040 46%,#c9a24a 70%,#b8572a 100%);box-shadow:inset 0 2px 4px #0007;overflow:hidden}
#mashZone{position:absolute;top:0;bottom:0;background:#7dff8a55;border-left:2px solid #b6ffbf;border-right:2px solid #b6ffbf}
#mashFill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffe08a,#ffb347);opacity:.75;transition:width .12s}
#mashLbl{display:flex;justify-content:space-between;font-family:Mitr;font-size:13px;color:#ffe9c4;margin-top:3px}
#mashLbl b{color:var(--gold);font-weight:500}
#actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{padding:10px 16px;border-radius:12px;font-size:16px;font-weight:500;color:#fff;box-shadow:0 4px 0 #0006;transition:transform .08s,filter .2s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0006}
.btn[disabled]{filter:grayscale(1) brightness(.7);cursor:not-allowed}
.b-pound{background:linear-gradient(#f2a03d,#d06a12)}
.b-serve{background:linear-gradient(#4fbf63,#2c8a3f)}
.b-reset{background:linear-gradient(#8d6e63,#5d4037);font-size:14px;padding:10px 12px}
.kbd{font-size:11px;opacity:.75;margin-left:4px}

.ticket{background:#fffdf3;border-radius:6px;padding:9px 10px 10px;box-shadow:0 6px 14px #0006;position:relative;min-height:96px;cursor:pointer;border:3px solid transparent;transition:border-color .2s,transform .2s;
 background-image:repeating-linear-gradient(#fffdf3 0 23px,#e8e0c8 23px 24px)}
.ticket.sel{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 0 0 3px #ffcf5a55,0 8px 18px #0007}
.ticket .tq{position:absolute;right:8px;top:-10px;font-family:Mitr;font-size:12px;background:#5d3418;color:#ffe9c4;padding:0 8px;border-radius:8px}
.ticket.sel .tq{background:var(--gold);color:#4a2a10}
.ticket h3{margin:0;font-family:Mitr;font-weight:600;font-size:17px;display:flex;justify-content:space-between;gap:6px}
.ticket h3 span{font-size:12px;color:#a0522d;font-weight:400;white-space:nowrap}
.ticket .who{font-size:12px;color:#8a6a4a}
.ticket .req{font-size:13.5px;color:#7a3b1d;margin:2px 0 5px;line-height:1.35}
.ticket .rows{display:flex;flex-wrap:wrap;gap:4px}
.ticket .row{display:flex;align-items:center;gap:2px;padding:1px 7px 1px 2px;border-radius:20px;background:#f1e6cf;font-family:Mitr;font-size:13px;border:2px solid transparent}
.ticket .row svg{width:22px;height:22px}
.ticket .row.ok{background:#d9f3d2;border-color:#5fbf5f}
.ticket .row.over{background:#ffd9d2;border-color:#e2402b}
.ticket .empty{color:#9b8a70;font-size:15px;padding-top:24px;text-align:center}
.ticket .status{font-family:Mitr;color:#a0522d;padding-top:8px}
.ticket .tp{height:6px;border-radius:3px;background:#e6dcc4;margin-top:6px;overflow:hidden}
.ticket .tp i{display:block;height:100%;background:#5fd068;transition:width .1s linear}

.card-i{position:relative;background:var(--cream);border-radius:14px;padding:6px 4px 6px;text-align:center;box-shadow:0 4px 0 #0005,0 6px 12px #0003;transition:transform .1s}
.card-i:hover:not([disabled]){transform:translateY(-3px)}
.card-i:active:not([disabled]){transform:translateY(2px)}
.card-i svg{width:58px;height:58px;display:block;margin:0 auto;filter:drop-shadow(0 3px 2px #0004)}
.card-i .nm{font-family:Mitr;font-size:13px;color:#4a2a14;line-height:1.2}
.card-i .k{position:absolute;left:6px;top:4px;font-size:11px;color:#a08060;font-family:Mitr}
.card-i .ct{position:absolute;right:4px;top:4px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-family:Mitr;font-size:13px;line-height:22px;display:none}
.card-i .ct.on{display:block}
.card-i.locked{background:#3b2a20;box-shadow:inset 0 0 0 2px #6b4c36;opacity:.85;cursor:not-allowed}
.card-i.locked .nm{color:#e8d4b8}
.card-i.locked .lk{font-size:28px;height:58px;line-height:58px}
.card-i.locked .lv{font-size:11px;color:var(--gold);font-family:Mitr}

.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(15,6,24,.62);backdrop-filter:blur(2px);padding:16px}
.ov.show{display:flex}
.card{background:var(--cream);border-radius:20px;padding:20px 22px;max-width:460px;width:100%;box-shadow:0 20px 50px #000a;animation:popin .3s cubic-bezier(.2,.9,.3,1.3);max-height:calc(100vh - 40px);overflow:auto}
@keyframes popin{from{transform:scale(.7);opacity:0}}
.card h1{font-family:Mitr;font-weight:600;font-size:34px;margin:0;color:#b8321f;text-align:center;line-height:1.1}
.card h2{font-family:Mitr;font-weight:600;margin:0 0 8px;font-size:22px}
.card .sub{text-align:center;color:#7a4a2a;margin:4px 0 12px}
.card ul{padding-left:20px;margin:8px 0 14px;line-height:1.6}
.bigbtn{display:block;width:100%;padding:13px;border-radius:14px;font-size:19px;color:#fff;background:linear-gradient(#ef5a3c,#c2321b);box-shadow:0 5px 0 #7d1d0e;margin-top:8px}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #7d1d0e}

#rantOv .card{background:#2a1410;color:#ffe9d6;border:3px solid #e2402b}
#rantOv h2{color:#ff7a5c;text-align:center}
.rantLine{font-size:18px;font-weight:700;text-align:center;margin:4px 0 12px;line-height:1.5}
.rtimer{height:8px;background:#0008;border-radius:4px;overflow:hidden;margin-bottom:12px}
.rtimer i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#e2402b);width:100%}
.rbtn{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:12px;margin-bottom:8px;color:#fff;font-size:15px;line-height:1.35;box-shadow:0 4px 0 #0008}
.rbtn b{font-size:17px;display:block}
.rbtn.soothe{background:linear-gradient(#5aa9e6,#2f6fb0)}
.rbtn.sass{background:linear-gradient(#b07ae0,#7240a8)}
.rbtn.clap{background:linear-gradient(#ef5a3c,#b82a14)}
.hint{font-size:13px;opacity:.75;text-align:center}
.vs{font-family:Mitr;font-weight:600;font-size:56px;text-align:center;color:#ffd23f;text-shadow:0 4px 0 #b82a14,0 0 30px #ff5a00;animation:vs .5s cubic-bezier(.2,.9,.3,1.6)}
@keyframes vs{from{transform:scale(3) rotate(-10deg);opacity:0}}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.sumgrid div{background:#f1e6cf;border-radius:12px;padding:8px 10px;font-size:14px}
.sumgrid b{display:block;font-family:Mitr;font-size:22px;font-weight:500}
#sLog{max-height:190px;overflow:auto;border-top:1px dashed #d9c7a5;margin-top:6px;padding-top:6px}
#sLog div{font-size:13.5px;padding:5px 0;border-bottom:1px dashed #eadcc0;line-height:1.4}
#sLog .s{color:#ffb400}
#toast{position:absolute;left:50%;top:340px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:20px;font-family:Mitr;z-index:15;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}


/* arena */
#arenaOv{padding:0;background:#0b0610}
#arena{position:relative;width:100%;max-width:1000px;margin:0 auto;height:100%;display:flex;flex-direction:column;
 background:linear-gradient(#1a0f24 0%,#2c1830 45%,#3b2028 62%,#2a1a14 62.2%,#4a3020 100%)}
#arena:before{content:"";position:absolute;left:0;right:0;top:0;height:62%;opacity:.35;pointer-events:none;
 background:repeating-linear-gradient(0deg,transparent 0 22px,#00000066 22px 24px),repeating-linear-gradient(90deg,transparent 0 46px,#00000055 46px 48px);}
.ar-top{position:relative;display:flex;align-items:center;gap:10px;padding:12px 14px 4px;z-index:2}
.hpw{flex:1}.hpw .nm{font-family:Mitr;color:#ffe9c4;font-size:14px;margin-bottom:3px}
.hpw.foe{text-align:right}
.hp{position:relative;height:20px;border-radius:10px;background:#000a;border:2px solid #ffffff33;overflow:hidden}
.hp i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#7ef08a,#2fae4a);transition:width .2s}
.hpw.foe .hp i{left:auto;right:0;background:linear-gradient(#ff8a6a,#d23a1e)}
.hp span{position:absolute;inset:0;text-align:center;font-family:Mitr;font-size:13px;line-height:16px;color:#fff;text-shadow:0 1px 2px #000}
#arTime{font-family:Mitr;font-weight:600;font-size:30px;color:#ffd23f;min-width:48px;text-align:center;text-shadow:0 3px 0 #000}
#arField{position:relative;flex:1;min-height:260px;overflow:hidden}
.crowdrow{position:absolute;left:0;right:0;top:18%;height:70px;opacity:.55;background:
 radial-gradient(circle 13px at 20px 14px,#120a18 98%,transparent) 0 0/44px 70px repeat-x,
 radial-gradient(ellipse 20px 34px at 20px 54px,#120a18 98%,transparent) 0 0/44px 70px repeat-x;animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(4px)}}
.cheer{position:absolute;top:10%;font-family:Mitr;font-size:15px;color:#ffe9a8;text-shadow:0 2px 0 #000;white-space:nowrap;pointer-events:none}
#pl,#foe{position:absolute;bottom:4%;width:190px;height:238px}
#pl{left:10%}#foe{right:10%;cursor:pointer}
#pl .body,#foe .body{width:100%;height:100%}
#pl svg,#foe svg{width:100%;height:100%;overflow:visible}
#foe .body{transform:scaleX(-1)}
#foe{transition:transform .12s}
#foe.wind{transform:translateX(22px) rotate(8deg);filter:drop-shadow(0 0 16px #ff3b1f)}
#foe.strike{animation:lunge .3s ease-out}
@keyframes lunge{40%{transform:translateX(-150px) rotate(-6deg)}100%{transform:none}}
#foe.stun{filter:grayscale(.6) brightness(.85);animation:wob .6s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-5deg)}}
#foe.ko,#pl.ko{transition:transform .5s cubic-bezier(.5,0,.7,1.4);transform:rotate(80deg) translateY(40px);transform-origin:50% 100%}
#pl.ko{transform:rotate(-80deg) translateY(40px)}
#warn{position:absolute;left:50%;top:-30px;transform:translateX(-50%) scale(.4);padding:4px 12px 4px 6px;border-radius:20px;color:#fff;font-family:Mitr;font-weight:600;font-size:16px;white-space:nowrap;opacity:0;transition:transform .1s,opacity .1s;text-shadow:0 2px 0 #0006;z-index:3}
#warn span{display:inline-block;font-size:22px;vertical-align:-3px;margin-right:4px}
#warn.on{opacity:1;transform:translateX(-50%) scale(1);animation:pulse .28s ease-in-out infinite alternate}
#warn.heavy{font-size:18px}
@keyframes pulse{to{transform:translateX(-50%) scale(1.12)}}
#buffTag{position:absolute;right:0;bottom:-2px;font-family:Mitr;font-size:13px;color:#7ef08a;text-shadow:0 2px 0 #000;white-space:nowrap}
#foe.strikeBig{animation:lungeBig .38s ease-out}
@keyframes lungeBig{45%{transform:translateX(-230px) rotate(-10deg) scale(1.08)}100%{transform:none}}
#foe.blocking{filter:drop-shadow(0 0 16px #3d8fd6) brightness(.9)}
#foe.blocking:after{content:"🛡";position:absolute;left:-20px;top:30%;font-size:70px;opacity:.9;filter:drop-shadow(0 0 10px #7cc8ff)}
#foe.taunting{animation:taunt .35s ease-in-out infinite alternate;filter:drop-shadow(0 0 18px #20bf6b)}
@keyframes taunt{to{transform:translateY(-14px) scale(1.04)}}
#foe.rage .body{filter:drop-shadow(0 0 14px #ff3b1f) saturate(1.4)}
#pl.counter{filter:drop-shadow(0 0 20px #ffd23f)}
#wpn{position:absolute;left:72%;top:36%;width:48px;height:150px;transform-origin:50% 92%;transform:rotate(-20deg);filter:drop-shadow(3px 5px 3px #0007);transition:transform .1s}
#wpn svg{width:100%;height:100%}
#wpn.w-blade{width:56px;height:160px}
#wpn.w-lid{width:110px;height:110px;left:62%;top:44%;transform-origin:50% 50%;transform:none}
#wpn.w-mortar{width:120px;height:100px;left:58%;top:50%;transform-origin:30% 80%;transform:rotate(-30deg) translateY(-20px)}
#pl.guard #wpn{transform:rotate(-85deg) translate(-10px,10px)}
#pl.guard #wpn.w-lid{transform:translate(20px,-40px) scale(1.35)}
#pl.guard #wpn.w-mortar{transform:translate(0,-50px) rotate(0)}
#pl.guard{filter:drop-shadow(0 0 14px #7cc8ff)}
#pl.wall{filter:drop-shadow(0 0 26px #b8e4ff) brightness(1.1)}
#arMsg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:Mitr;font-weight:600;font-size:54px;white-space:nowrap;text-shadow:0 4px 0 #000,0 0 30px #ff5a00;pointer-events:none;opacity:0;z-index:5}
.arpop{position:absolute;font-family:Mitr;font-weight:600;white-space:nowrap;text-shadow:0 3px 0 #000;pointer-events:none;z-index:4}
.ar-help{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;color:#e8d4b8;font-size:13px;padding:2px 12px}
.ar-help b{color:#ffd23f;font-weight:600}
.ar-btns{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr 1.4fr 1fr;gap:10px;padding:10px 14px 16px}
.ar-btns button{position:relative;overflow:hidden;border-radius:16px;padding:14px 6px;color:#fff;box-shadow:0 5px 0 #0009;touch-action:manipulation}
.ar-btns button:active{transform:translateY(3px);box-shadow:0 2px 0 #0009}
.ar-btns b{display:block;font-size:18px;font-weight:500}.ar-btns small{font-size:11px;opacity:.75}
#aGuard{background:linear-gradient(#5aa9e6,#2f6fb0)}
#aHit{background:linear-gradient(#ef5a3c,#b82a14)}
#aHit.cool,#aGuard.cool,#aDodge.cool{filter:brightness(.72)}
#aDodge{background:linear-gradient(#26c6a6,#138a72)}
#aSp.silenced{filter:grayscale(1)}
#aSp{background:linear-gradient(#b07ae0,#7240a8);--cd:100%}
#aSp:after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--cd);background:#000a;pointer-events:none}
#aSp.ready{box-shadow:0 5px 0 #0009,0 0 18px #e0b0ff}
/* shop */
.card.shop{max-width:620px}
#shGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.wcard{display:flex;gap:8px;background:#f1e6cf;border-radius:14px;padding:10px;border:3px solid transparent}
.wcard.sel{border-color:#e2a400;background:#fff1c8}
.wcard.lockw{opacity:.9;background:#e6dccb}
.wart{flex:none;width:54px;height:110px;display:flex;align-items:center;justify-content:center}
.wart svg{max-width:100%;max-height:100%}
.wart.w-pestle svg,.wart.w-blade svg{height:104px}
.winfo{flex:1;font-size:13px}
.winfo b{font-family:Mitr;font-size:17px;font-weight:600}
.winfo .lv{font-family:Mitr;font-size:12px;background:#5d3418;color:#ffe9c4;padding:0 6px;border-radius:8px}
.stat{display:flex;align-items:center;gap:2px;font-size:11px;color:#6b4a2a}
.stat span{width:26px}
.stat i{width:12px;height:7px;border-radius:2px;background:#d6c6a6}
.stat i.on{background:#e2402b}
.wd{margin-top:3px;color:#5d3418;line-height:1.35}
.ws{color:#2c7a3f;font-weight:600;line-height:1.35;margin-top:2px}
.wb{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sbtn{padding:5px 10px;border-radius:9px;font-size:13px;color:#fff;background:linear-gradient(#8d6e63,#5d4037);box-shadow:0 3px 0 #0005}
.sbtn.buy{background:linear-gradient(#4fbf63,#2c8a3f)}
.sbtn.up{background:linear-gradient(#f2a03d,#d06a12)}
.sbtn.eq{background:#e2a400}
.sbtn[disabled]{filter:grayscale(.8);opacity:.6;cursor:not-allowed}
@media (max-width:720px){
 #pl,#foe{width:140px;height:175px}#pl{left:3%}#foe{right:3%}
 #arMsg{font-size:38px}
 .ar-btns{gap:6px;padding:8px 8px 14px}
 .ar-btns b{font-size:15px}
 .ar-btns button{padding:12px 2px}
 .ar-help{font-size:11.5px;gap:2px 8px}
 #warn{font-size:13px;top:-34px}
 #shGrid{grid-template-columns:1fr}
}

 #stage{height:330px}
 .slot .tag{display:none}
 #mortarWrap{margin-top:74px}

 .bubble{left:6px;right:6px;top:38px;font-size:13.5px;padding:7px 10px;transform-origin:50% 100%}
 .bubble:before{left:50%;top:auto;bottom:-12px;margin-left:-8px;border:8px solid transparent;border-top:12px solid #fff;border-bottom:0}
 .bubble.angry:before{border-top-color:#ffe1dc;border-right-color:transparent}
 .rvpop{left:6px;right:6px;top:36px;font-size:12.5px;padding:7px 9px}
 .rvpop .st{font-size:16px}.rvpop .mn{font-size:14px}
 #counter{grid-template-columns:1fr;grid-template-areas:"tickets" "mortar" "tray";padding:14px 10px}
 #tickets{gap:8px}
 .ticket h3{font-size:15px}
 #tray{grid-template-columns:repeat(4,1fr);gap:7px}
 .card-i svg{width:48px;height:48px}
 .card-i .nm{font-size:12px}
 #toast{top:340px}
 .poptext{font-size:17px}
}
